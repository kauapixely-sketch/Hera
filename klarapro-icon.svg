<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F42"/>
      <stop offset="100%" stop-color="#163668"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8D4"/>
      <stop offset="100%" stop-color="#00E5C0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="400" height="400" rx="80" fill="none" stroke="#1A4A8A" stroke-width="2"/>

  <!-- K - vertical stroke (white) -->
  <line x1="142" y1="88" x2="142" y2="312" stroke="white" stroke-width="46" stroke-linecap="round"/>

  <!-- K - upper diagonal arm (white) -->
  <line x1="165" y1="200" x2="282" y2="88" stroke="white" stroke-width="44" stroke-linecap="round"/>

  <!-- K - lower diagonal arm (teal gradient) -->
  <line x1="165" y1="200" x2="282" y2="312" stroke="url(#teal)" stroke-width="44" stroke-linecap="round"/>

  <!-- Junction dot (teal) -->
  <circle cx="165" cy="200" r="10" fill="#00D4E0"/>

  <!-- AI sparkle top-right -->
  <g transform="translate(300, 105)">
    <path d="M0,-14 L2.5,-2.5 L14,0 L2.5,2.5 L0,14 L-2.5,2.5 L-14,0 L-2.5,-2.5 Z" fill="#00D4E0" opacity="0.95"/>
  </g>
  <!-- smaller sparkle -->
  <g transform="translate(270, 75)">
    <path d="M0,-7 L1.2,-1.2 L7,0 L1.2,1.2 L0,7 L-1.2,1.2 L-7,0 L-1.2,-1.2 Z" fill="#00D4E0" opacity="0.6"/>
  </g>
</svg>
