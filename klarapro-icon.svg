<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="amberGlow" cx="42%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.9" fill="#1C1C1C"/>
    </pattern>
    <clipPath id="roundClip">
      <rect width="400" height="400" rx="80"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="400" height="400" rx="80" fill="#0A0A0A"/>
  <!-- Dot grid texture -->
  <rect width="400" height="400" clip-path="url(#roundClip)" fill="url(#dots)"/>
  <!-- Amber radial glow -->
  <rect width="400" height="400" clip-path="url(#roundClip)" fill="url(#amberGlow)"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="398" height="398" rx="79" fill="none" stroke="#222222" stroke-width="2"/>

  <!-- K lettermark — all amber, arms merge into bar -->
  <!-- Vertical bar -->
  <rect x="68" y="68" width="54" height="264" rx="7" fill="#F5B000"/>
  <!-- Upper arm (starts inside bar for seamless merge) -->
  <line x1="95" y1="200" x2="318" y2="68" stroke="#F5B000" stroke-width="52" stroke-linecap="round"/>
  <!-- Lower arm -->
  <line x1="95" y1="200" x2="318" y2="332" stroke="#F5B000" stroke-width="52" stroke-linecap="round"/>
</svg>
