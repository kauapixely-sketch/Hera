<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="38%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#191919"/>
    </pattern>
    <clipPath id="clip">
      <rect width="400" height="400" rx="80"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" rx="80" fill="#0A0A0A"/>
  <rect width="400" height="400" clip-path="url(#clip)" fill="url(#dots)"/>
  <rect width="400" height="400" clip-path="url(#clip)" fill="url(#glow)"/>
  <rect x="1" y="1" width="398" height="398" rx="79" fill="none" stroke="#1E1E1E" stroke-width="2"/>

  <!--
    K lettermark — filled polygons, zero rounded caps.
    Bar: x=72 y=52 w=48 h=296 (centered in 400×400)
    Upper arm center line: (120,200) → (318,72)   vec=(198,-128)  |v|=235.7  u=(0.840,-0.543)  perp=(0.543,0.840)
    Lower arm center line: (120,200) → (318,328)  vec=(198,128)   |v|=235.7  u=(0.840,0.543)   perp=(0.543,-0.840)
    half-thickness = 24
  -->

  <!-- Upper arm parallelogram (perp = ±24*(0.543, 0.840)) -->
  <polygon points="
    107.0,179.8
    304.9,53.7
    331.0,90.4
    133.0,220.2
  " fill="#F5B000"/>

  <!-- Lower arm parallelogram -->
  <polygon points="
    133.0,179.8
    331.0,309.6
    304.9,346.3
    107.0,220.2
  " fill="#F5B000"/>

  <!-- Vertical bar (drawn last to cleanly cap the arm junction) -->
  <rect x="72" y="52" width="48" height="296" rx="5" fill="#F5B000"/>
</svg>
