<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#161616"/>
    </pattern>
    <radialGradient id="glowTop" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="1080" height="1080"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0A0A0A"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect width="1080" height="1080" fill="url(#glowTop)"/>
  <rect width="1080" height="1080" fill="url(#glowBot)"/>

  <!-- Ghost K watermark (background, very faint) -->
  <g transform="translate(580, 160) scale(2.6)" opacity="0.03">
    <polygon points="35,127.8 232.9,1.7 259,38.4 61,168.2" fill="#F5B000"/>
    <polygon points="61,127.8 259,257.6 232.9,294.3 35,168.2" fill="#F5B000"/>
    <rect x="0" y="0" width="48" height="296" rx="5" fill="#F5B000"/>
  </g>

  <!-- ── TOP HALF: DOR ── -->

  <!-- Eyebrow label -->
  <rect x="80" y="108" width="8" height="8" rx="4" fill="#555555"/>
  <text x="100" y="117" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="18" font-weight="600" fill="#555555" letter-spacing="4">VOCÊ JÁ VIVEU ISSO</text>

  <!-- Slogan 1 — pain -->
  <text x="80" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-3">A cláusula</text>
  <text x="80" y="336" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-3">que você não</text>
  <text x="80" y="442" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-3">leu <tspan fill="#888888">custou</tspan></text>
  <text x="80" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-3">o contrato.</text>

  <!-- ── DIVIDER ── -->
  <rect x="80" y="592" width="920" height="2" fill="#1E1E1E"/>
  <!-- Amber accent on divider -->
  <rect x="80" y="592" width="180" height="2" fill="#F5B000"/>

  <!-- ── BOTTOM HALF: SOLUÇÃO ── -->

  <!-- Eyebrow label -->
  <rect x="80" y="628" width="8" height="8" rx="4" fill="#F5B000"/>
  <text x="100" y="637" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="18" font-weight="600" fill="#F5B000" letter-spacing="4">A SOLUÇÃO</text>

  <!-- Slogan 2 — solution (big, amber) -->
  <text x="80" y="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="108" font-weight="900" fill="#F5B000" letter-spacing="-3">Não leia</text>
  <text x="80" y="876" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="108" font-weight="900" fill="#F5B000" letter-spacing="-3">editais.</text>
  <text x="80" y="978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Ganhe licitações.</text>

  <!-- Brand bottom-right -->
  <g transform="translate(888, 940) scale(0.22)">
    <polygon points="35,127.8 232.9,1.7 259,38.4 61,168.2" fill="#F5B000"/>
    <polygon points="61,127.8 259,257.6 232.9,294.3 35,168.2" fill="#F5B000"/>
    <rect x="0" y="0" width="48" height="296" rx="5" fill="#F5B000"/>
  </g>
  <text x="960" y="1010" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Klara</text>
  <text x="960" y="1034" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" fill="#444444" letter-spacing="1">klarapro.com.br</text>

  <!-- Left amber edge bar -->
  <rect x="0" y="0" width="8" height="1080" fill="#F5B000" opacity="0.7"/>
</svg>
