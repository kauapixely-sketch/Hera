<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0L0 0 0 44" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowL" cx="18%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="82%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Base + texture -->
  <rect width="1584" height="396" fill="#0A0A0A"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glowL)"/>
  <rect width="1584" height="396" fill="url(#glowR)"/>

  <!--
    K icon: scale=2.2 → K height=296*2.2=651px → that's too big for a 396px banner.
    Better: scale=0.9 → K height=266px, positioned at y=(396-266)/2=65
    translate(58, 65) scale(0.9)
    Same arm polygons in K-space (origin at bar top-left):
  -->
  <!-- Decorative large K (ghost, very subtle) -->
  <g transform="translate(-40, -20) scale(1.5)" opacity="0.035">
    <polygon points="35,127.8 232.9,1.7 259,38.4 61,168.2" fill="#F5B000"/>
    <polygon points="61,127.8 259,257.6 232.9,294.3 35,168.2" fill="#F5B000"/>
    <rect x="0" y="0" width="48" height="296" rx="5" fill="#F5B000"/>
  </g>

  <!-- Real K icon (scale=0.9 → 266px tall) -->
  <g transform="translate(60, 65) scale(0.9)">
    <polygon points="35,127.8 232.9,1.7 259,38.4 61,168.2" fill="#F5B000"/>
    <polygon points="61,127.8 259,257.6 232.9,294.3 35,168.2" fill="#F5B000"/>
    <rect x="0" y="0" width="48" height="296" rx="5" fill="#F5B000"/>
  </g>

  <!-- Fade edge after K -->
  <rect x="200" y="0" width="80" height="396" fill="url(#fadeLeft)"/>

  <!-- "Klara" wordmark -->
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" letter-spacing="-4">
    <tspan x="296" y="262" font-size="164" fill="#FFFFFF">Klara</tspan>
  </text>

  <!-- "pro" badge pill -->
  <rect x="858" y="118" width="82" height="38" rx="19" fill="#F5B000"/>
  <text x="899" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle" letter-spacing="1.5">PRO</text>

  <!-- Slogan 2 — solução (sob o wordmark) -->
  <text x="298" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26" font-weight="700" fill="#F5B000" letter-spacing="-0.5">Não leia editais. Ganhe licitações.</text>

  <!-- Vertical divider -->
  <line x1="966" y1="56" x2="966" y2="340" stroke="#1C1C1C" stroke-width="1.5"/>

  <!-- === RIGHT COLUMN === -->

  <!-- Slogan 1 — dor (headline direita) -->
  <text x="996" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">A cláusula que você</text>
  <text x="996" y="184" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">não leu custou</text>
  <text x="996" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38" font-weight="800" fill="#F5B000" letter-spacing="-1">o contrato.</text>

  <!-- Stats -->
  <text x="998" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="21" font-weight="800" fill="#FFFFFF">4h → 30min</text>
  <text x="998" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="500" fill="#3D3D3D" letter-spacing="2">POR EDITAL</text>

  <line x1="1146" y1="287" x2="1146" y2="332" stroke="#222222" stroke-width="1"/>

  <text x="1160" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="21" font-weight="800" fill="#FFFFFF">Score 0–100</text>
  <text x="1160" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="500" fill="#3D3D3D" letter-spacing="2">ADERÊNCIA</text>

  <line x1="1316" y1="287" x2="1316" y2="332" stroke="#222222" stroke-width="1"/>

  <text x="1330" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="21" font-weight="800" fill="#FFFFFF">20+ segmentos</text>
  <text x="1330" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="500" fill="#3D3D3D" letter-spacing="2">COBERTOS</text>

  <!-- Top announcement bar -->
  <rect x="0" y="0" width="1584" height="30" fill="#0D0D0D"/>
  <rect x="0" y="29" width="1584" height="1" fill="#1A1A1A"/>
  <circle cx="534" cy="15" r="3" fill="#F5B000"/>
  <text x="548" y="20" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12" fill="#555555" letter-spacing="0.3">Análise completa em menos de 60 segundos  ·  14 dias grátis  ·  sem cobrança antes do 15º dia</text>

  <!-- Bottom amber bar -->
  <rect x="0" y="384" width="1584" height="12" fill="#F5B000" opacity="0.85"/>
</svg>
