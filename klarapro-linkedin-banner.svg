<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <!-- Amber left glow -->
    <radialGradient id="leftGlow" cx="20%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <!-- Right subtle glow -->
    <radialGradient id="rightGlow" cx="85%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1584" height="396" fill="#0A0A0A"/>
  <!-- Grid texture -->
  <rect width="1584" height="396" fill="url(#grid)"/>
  <!-- Glow overlays -->
  <rect width="1584" height="396" fill="url(#leftGlow)"/>
  <rect width="1584" height="396" fill="url(#rightGlow)"/>

  <!-- === LEFT SECTION: Logo === -->

  <!-- K icon (large, decorative behind) -->
  <g opacity="0.04">
    <rect x="-30" y="40" width="120" height="316" fill="#F5B000"/>
    <line x1="90" y1="198" x2="380" y2="40" stroke="#F5B000" stroke-width="118" stroke-linecap="round"/>
    <line x1="90" y1="198" x2="380" y2="356" stroke="#F5B000" stroke-width="118" stroke-linecap="round"/>
  </g>

  <!-- K icon (real, visible) -->
  <rect x="60" y="94" width="30" height="208" rx="4" fill="#F5B000"/>
  <line x1="90" y1="198" x2="210" y2="94" stroke="#F5B000" stroke-width="30" stroke-linecap="round"/>
  <line x1="90" y1="198" x2="210" y2="302" stroke="#F5B000" stroke-width="30" stroke-linecap="round"/>

  <!-- "Klara" wordmark -->
  <text x="236" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="148" font-weight="800" fill="#FFFFFF" letter-spacing="-5">Klara</text>

  <!-- "pro" badge -->
  <rect x="824" y="120" width="80" height="36" rx="18" fill="#F5B000"/>
  <text x="864" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0A0A0A" text-anchor="middle" letter-spacing="1">PRO</text>

  <!-- Tagline under wordmark -->
  <text x="238" y="292" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#555555" letter-spacing="5">IA PARA LICITAÇÕES PÚBLICAS</text>

  <!-- Vertical divider -->
  <line x1="940" y1="60" x2="940" y2="336" stroke="#1E1E1E" stroke-width="1.5"/>

  <!-- === RIGHT SECTION: Value prop + stats === -->

  <!-- Eyebrow label -->
  <rect x="972" y="72" width="10" height="10" rx="5" fill="#F5B000"/>
  <text x="992" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5B000" letter-spacing="3">POR QUE USAR</text>

  <!-- Main headline -->
  <text x="970" y="152" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Analistas custam R$ 8.000/mês.</text>
  <text x="970" y="204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">A Klara entrega o mesmo</text>
  <!-- "em 30 segundos." in amber -->
  <text x="970" y="256" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#F5B000" letter-spacing="-1">em 30 segundos.</text>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <text x="972" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">4h → 30min</text>
  <text x="972" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="1.5">POR EDITAL</text>

  <!-- Separator -->
  <line x1="1118" y1="302" x2="1118" y2="346" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Stat 2 -->
  <text x="1132" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Score 0-100</text>
  <text x="1132" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="1.5">ADERÊNCIA</text>

  <!-- Separator -->
  <line x1="1292" y1="302" x2="1292" y2="346" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Stat 3 -->
  <text x="1306" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">20+ segmentos</text>
  <text x="1306" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="1.5">COBERTOS</text>

  <!-- Bottom amber bar -->
  <rect x="0" y="382" width="1584" height="14" fill="#F5B000" opacity="0.9"/>

  <!-- Top announcement bar (like site) -->
  <rect x="0" y="0" width="1584" height="32" fill="#111111"/>
  <circle cx="540" cy="16" r="3.5" fill="#F5B000"/>
  <text x="556" y="21" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#AAAAAA" letter-spacing="0.5">Análise completa em menos de 60 segundos · 14 dias grátis · sem cobrança antes do 15º dia</text>
</svg>
