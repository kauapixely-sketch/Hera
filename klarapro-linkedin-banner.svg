<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgBanner" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#081629"/>
      <stop offset="55%" stop-color="#0D2448"/>
      <stop offset="100%" stop-color="#0A3060"/>
    </linearGradient>
    <linearGradient id="tealBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8D4"/>
      <stop offset="100%" stop-color="#00E5C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgBanner)"/>

  <!-- Decorative circles background -->
  <circle cx="1350" cy="200" r="280" fill="none" stroke="#1A3A6A" stroke-width="1" opacity="0.5"/>
  <circle cx="1350" cy="200" r="200" fill="none" stroke="#1A3A6A" stroke-width="1" opacity="0.4"/>
  <circle cx="1350" cy="200" r="120" fill="none" stroke="#00C8D4" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="380" r="160" fill="none" stroke="#1A3A6A" stroke-width="1" opacity="0.3"/>

  <!-- K icon (left) -->
  <line x1="80" y1="80" x2="80" y2="316" stroke="white" stroke-width="40" stroke-linecap="round"/>
  <line x1="100" y1="198" x2="210" y2="80" stroke="white" stroke-width="38" stroke-linecap="round"/>
  <line x1="100" y1="198" x2="210" y2="316" stroke="url(#tealBanner)" stroke-width="38" stroke-linecap="round"/>
  <circle cx="100" cy="198" r="9" fill="#00D4E0"/>

  <!-- sparkles -->
  <g transform="translate(218, 90)">
    <path d="M0,-14 L2.5,-2.5 L14,0 L2.5,2.5 L0,14 L-2.5,2.5 L-14,0 L-2.5,-2.5 Z" fill="#00D4E0" opacity="0.9"/>
  </g>
  <g transform="translate(195, 62)">
    <path d="M0,-7 L1.2,-1.2 L7,0 L1.2,1.2 L0,7 L-1.2,1.2 L-7,0 L-1.2,-1.2 Z" fill="#00D4E0" opacity="0.55"/>
  </g>

  <!-- Divider -->
  <line x1="248" y1="70" x2="248" y2="326" stroke="#1E3E6E" stroke-width="2"/>

  <!-- KlaraPro text -->
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="130" font-weight="800" letter-spacing="-2">
    <tspan x="278" y="260" fill="white">Klara</tspan><tspan fill="url(#tealBanner)">Pro</tspan>
  </text>

  <!-- Tagline -->
  <text x="282" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#7AACCF" letter-spacing="7" font-weight="300">IA QUE LÊ SEU EDITAL EM SEGUNDOS</text>

  <!-- Right side: 3 feature pills -->
  <g transform="translate(980, 118)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#0D2448" stroke="#00C8D4" stroke-width="1.5" opacity="0.9"/>
    <circle cx="26" cy="22" r="8" fill="#00C8D4" opacity="0.2"/>
    <text x="22" y="26" font-family="Arial, sans-serif" font-size="13" fill="#00D4E0">✦</text>
    <text x="48" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" font-weight="500">Análise automática de edital</text>

    <!-- Pill 2 -->
    <rect x="0" y="58" width="260" height="44" rx="22" fill="#0D2448" stroke="#00C8D4" stroke-width="1.5" opacity="0.9"/>
    <circle cx="26" cy="80" r="8" fill="#00C8D4" opacity="0.2"/>
    <text x="22" y="84" font-family="Arial, sans-serif" font-size="13" fill="#00D4E0">✦</text>
    <text x="48" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" font-weight="500">Prazos e requisitos extraídos</text>

    <!-- Pill 3 -->
    <rect x="0" y="116" width="240" height="44" rx="22" fill="#0D2448" stroke="#00C8D4" stroke-width="1.5" opacity="0.9"/>
    <circle cx="26" cy="138" r="8" fill="#00C8D4" opacity="0.2"/>
    <text x="22" y="142" font-family="Arial, sans-serif" font-size="13" fill="#00D4E0">✦</text>
    <text x="48" y="143" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" font-weight="500">Zero risco de desclassificação</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="376" width="1584" height="20" fill="#00C8D4" opacity="0.15"/>
  <rect x="0" y="388" width="1584" height="8" fill="#00C8D4" opacity="0.4"/>
</svg>
