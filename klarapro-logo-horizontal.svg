<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F42"/>
      <stop offset="100%" stop-color="#163668"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8D4"/>
      <stop offset="100%" stop-color="#00E5C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="28" fill="url(#bg2)"/>
  <rect width="720" height="200" rx="28" fill="none" stroke="#1A4A8A" stroke-width="2"/>

  <!-- K icon (left side, scaled) -->
  <!-- vertical stroke -->
  <line x1="52" y1="38" x2="52" y2="162" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- upper arm -->
  <line x1="63" y1="100" x2="120" y2="38" stroke="white" stroke-width="21" stroke-linecap="round"/>
  <!-- lower arm (teal) -->
  <line x1="63" y1="100" x2="120" y2="162" stroke="url(#teal2)" stroke-width="21" stroke-linecap="round"/>
  <!-- junction dot -->
  <circle cx="63" cy="100" r="5" fill="#00D4E0"/>

  <!-- sparkle -->
  <g transform="translate(124, 44)">
    <path d="M0,-8 L1.5,-1.5 L8,0 L1.5,1.5 L0,8 L-1.5,1.5 L-8,0 L-1.5,-1.5 Z" fill="#00D4E0" opacity="0.9"/>
  </g>

  <!-- Divider line -->
  <line x1="148" y1="40" x2="148" y2="160" stroke="#1A4A8A" stroke-width="2"/>

  <!-- "Klara" text (white) + "Pro" (teal) -->
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1">
    <tspan x="170" y="128" fill="white">Klara</tspan><tspan fill="url(#teal2)">Pro</tspan>
  </text>

  <!-- Tagline -->
  <text x="172" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7AACCF" letter-spacing="3.5" font-weight="400">IA PARA LICITAÇÕES</text>
</svg>
