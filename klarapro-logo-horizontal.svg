<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160">
  <defs>
    <radialGradient id="glow2" cx="10%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#191919"/>
    </pattern>
    <clipPath id="clip2">
      <rect width="700" height="160" rx="18"/>
    </clipPath>
  </defs>

  <rect width="700" height="160" rx="18" fill="#0A0A0A"/>
  <rect width="700" height="160" clip-path="url(#clip2)" fill="url(#dots2)"/>
  <rect width="700" height="160" clip-path="url(#clip2)" fill="url(#glow2)"/>
  <rect x="1" y="1" width="698" height="158" rx="17" fill="none" stroke="#1E1E1E" stroke-width="1.5"/>

  <!--
    K icon scaled to 100px tall, positioned x=24 y=30.
    scale = 100/296 = 0.338
    Normalized coords (origin = bar top-left):
      Upper arm: (35.0,0)=(107-72,52-52)·0.338=scaled  →  let me use transform instead
    Using transform: translate(24,30) scale(0.338)
    Original K: bar x=72 y=52; shift to origin → bar x=0, y=0 in K-space
    Arm points in K-space: upper=(35, -0) ... let me recalculate from original.
    Original polygon points shifted by (72,52):
      Upper arm: (107-72,179.8-52)=35,127.8  (304.9-72,53.7-52)=232.9,1.7  (331-72,90.4-52)=259,38.4  (133-72,220.2-52)=61,168.2
      Lower arm: (133-72,179.8-52)=61,127.8  (331-72,309.6-52)=259,257.6  (304.9-72,346.3-52)=232.9,294.3  (107-72,220.2-52)=35,168.2
      Bar: x=0 y=0 w=48 h=296
  -->
  <g transform="translate(24,30) scale(0.338)">
    <polygon points="35,127.8 232.9,1.7 259,38.4 61,168.2" fill="#F5B000"/>
    <polygon points="61,127.8 259,257.6 232.9,294.3 35,168.2" fill="#F5B000"/>
    <rect x="0" y="0" width="48" height="296" rx="5" fill="#F5B000"/>
  </g>

  <!-- Divider -->
  <line x1="140" y1="32" x2="140" y2="128" stroke="#242424" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-2">
    <tspan x="160" y="112" font-size="90" fill="#FFFFFF">Klara</tspan><tspan font-size="32" fill="#F5B000" dy="-36" dx="5">pro</tspan>
  </text>

  <!-- Tagline -->
  <text x="162" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" letter-spacing="4">IA PARA LICITAÇÕES</text>
</svg>
