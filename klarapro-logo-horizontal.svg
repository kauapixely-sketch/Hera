<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160">
  <defs>
    <radialGradient id="glow2" cx="12%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#F5B000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F5B000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1C1C1C"/>
    </pattern>
    <clipPath id="rClip2">
      <rect width="680" height="160" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="680" height="160" rx="20" fill="#0A0A0A"/>
  <rect width="680" height="160" clip-path="url(#rClip2)" fill="url(#dots2)"/>
  <rect width="680" height="160" clip-path="url(#rClip2)" fill="url(#glow2)"/>
  <rect x="1" y="1" width="678" height="158" rx="19" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- K icon (compact) -->
  <rect x="24" y="28" width="13" height="104" rx="3" fill="#F5B000"/>
  <line x1="36" y1="80" x2="112" y2="28" stroke="#F5B000" stroke-width="13" stroke-linecap="round"/>
  <line x1="36" y1="80" x2="112" y2="132" stroke="#F5B000" stroke-width="13" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="136" y1="36" x2="136" y2="124" stroke="#222222" stroke-width="1.5"/>

  <!-- "Klara" in white, bold -->
  <text x="160" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="-3">Klara</text>

  <!-- "pro" in amber, superscript style -->
  <text x="524" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F5B000" letter-spacing="1">pro</text>

  <!-- Tagline -->
  <text x="162" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#555555" letter-spacing="3.5">IA PARA LICITAÇÕES</text>
</svg>
